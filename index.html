<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa Interativo de Westeros</title>
    <link rel="stylesheet" href="static/css/leaflet.css">
    <link rel="stylesheet" href="static/css/leaflet.draw.css">
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <header class="hero">
        <div class="hero__content">
            <div class="hero__pill">Westeros</div>
            <h1>Mapa de Conquistas</h1>
            <p class="hero__lede"></p>
        </div>
    </header>

    <main class="layout">
        <section class="map-wrapper">
            <div id="map" aria-label="Mapa interativo de Westeros"></div>
        </section>

        <section class="panel">
            <h2>Guia Rápido</h2>
            <ul>
                <li>Botão direito abre o banquete de insígnias (dragão, pin, navio ou muralha).</li>
                <li>A barra de desenho (canto superior esquerdo) marca rotas, muralhas e territórios.</li>
                <li>Limpe desenhos ou marcadores quando a guerra precisar de um novo começo.</li>
            </ul>
            <div class="control buttons">
                <button id="clear-draw" type="button">Limpar desenhos</button>
                <button id="clear-markers" type="button" class="button-secondary">Limpar marcadores</button>
                <button id="export-json" type="button" class="button-secondary">Exportar JSON</button>
                <button id="import-json" type="button" class="button-secondary">Importar JSON</button>
                <input id="import-file" type="file" accept="application/json" hidden>
            </div>

            <div class="control-group">
                <label class="color-label" for="draw-color">Cor dos desenhos</label>
                <input id="draw-color" type="color" value="#f59e0b">
            </div>

            <div class="swatches" aria-label="Selecione uma cor para desenhar">
                <div class="swatch" data-color="#184a47" style="--swatch:#184a47;" role="button" tabindex="0" aria-label="Cor #184a47"></div>
                <div class="swatch" data-color="#701918" style="--swatch:#701918;" role="button" tabindex="0" aria-label="Cor #701918"></div>
                <div class="swatch" data-color="#000000" style="--swatch:#000000;" role="button" tabindex="0" aria-label="Cor preta"></div>
                <div class="swatch" data-color="#ffffff" style="--swatch:#ffffff;" role="button" tabindex="0" aria-label="Cor branca"></div>
            </div>
        </section>
    </main>

    <script src="static/js/leaflet.js"></script>
    <script src="static/js/leaflet.draw.js"></script>
    <script>
        window.WESTEROS_IMAGE = "static/img/Westeros.png";
    </script>
    <script src="static/js/main.js"></script>
</body>
</html>
