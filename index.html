<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa Interativo de Known World</title>
    <link rel="stylesheet" href="static/css/leaflet.css">
    <link rel="stylesheet" href="static/css/leaflet.draw.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/got-theme.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar__header">
                <h1>Known World</h1>
                <p class="subtitle">Mapa de Conquistas</p>
            </div>
            
            <div class="sidebar__content">
                <section class="control-panel">
                    <div class="control-group" style="margin-top: 0; margin-bottom: 2rem;">
                        <label class="color-label" for="icon-size">Estandartes <span id="icon-size-value">1.0x</span></label>
                        <input id="icon-size" type="range" min="0.6" max="1.6" step="0.1" value="1.0">
                    </div>

                    <h2>Ordens de Batalha</h2>
                    <p class="instruction">Use o botão direito no mapa para convocar estandartes.</p>
                    
                    <div class="actions-group">
                        <button id="clear-draw" type="button" class="btn-got">Queimar Mapas</button>
                        <button id="clear-markers" type="button" class="btn-got">Dispensar Tropas</button>
                    </div>

                    <div class="actions-group">
                        <button id="export-json" type="button" class="btn-got secondary">Arquivar Corvo</button>
                        <button id="import-json" type="button" class="btn-got secondary">Ler Pergaminho</button>
                        <input id="import-file" type="file" accept="application/json" hidden>
                    </div>

                    <div class="control-group">
                        <label class="color-label" for="draw-color">Tinta do Meistre</label>
                        <div class="color-picker-wrapper">
                            <input id="draw-color" type="color" value="#f59e0b">
                            <div class="swatches">
                                <div class="swatch" data-color="#184a47" style="--swatch:#184a47;" role="button" tabindex="0" title="Verde Dragão"></div>
                                <div class="swatch" data-color="#701918" style="--swatch:#701918;" role="button" tabindex="0" title="Sangue Lannister"></div>
                                <div class="swatch" data-color="#1a1a1a" style="--swatch:#1a1a1a;" role="button" tabindex="0" title="Preto da Patrulha"></div>
                                <div class="swatch" data-color="#f5f5f5" style="--swatch:#f5f5f5;" role="button" tabindex="0" title="Branco Caminhante"></div>
                                <div class="swatch" data-color="#d4af37" style="--swatch:#d4af37;" role="button" tabindex="0" title="Ouro"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            
            <div class="sidebar__footer">
                <button id="theme-toggle" class="btn-got" style="width: 100%; margin-bottom: 1rem;">Modo Claro</button>
                <p>Valar Morghulis</p>
            </div>
        </aside>

        <main class="map-container">
            <div id="map" aria-label="Mapa interativo de Known World"></div>
        </main>
    </div>

    <script src="static/js/leaflet.js"></script>
    <script src="static/js/leaflet.draw.js"></script>
    <script>
        window.KNOWN_WORLD_IMAGE = "static/img/KnownWorld.png";
    </script>
    <script src="static/js/main.js"></script>
</body>
</html>
